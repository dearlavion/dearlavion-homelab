---
# Prepares the Proxmox host and builds the Ubuntu cloud-init template.
# Replaces manual steps 2-4. Safe to re-run: every task checks first.
#
#   ansible-playbook pve-host.yml

- name: Prepare Proxmox host
  hosts: proxmox
  gather_facts: true

  tasks:
    # ------------------------------------------------------------------
    # 1. Package repositories: enterprise off, no-subscription on
    # ------------------------------------------------------------------
    - name: Check which enterprise repo files exist
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/apt/sources.list.d/pve-enterprise.sources   # PVE 9
        - /etc/apt/sources.list.d/ceph.sources             # PVE 9
        - /etc/apt/sources.list.d/pve-enterprise.list      # PVE 8
        - /etc/apt/sources.list.d/ceph.list                # PVE 8
      register: repo_files

    - name: Disable enterprise repos (PVE 9, deb822 format)
      ansible.builtin.lineinfile:
        path: "{{ item }}"
        regexp: '^Enabled:'
        line: 'Enabled: false'
      loop: "{{ repo_files.results | selectattr('stat.exists') | map(attribute='item') | select('search', '\\.sources$') | list }}"

    - name: Disable enterprise repos (PVE 8, one-line format)
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: '^deb '
        replace: '# deb '
      loop: "{{ repo_files.results | selectattr('stat.exists') | map(attribute='item') | select('search', '\\.list$') | list }}"

    - name: Add no-subscription repo (PVE 9 / Debian trixie)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/proxmox.sources
        mode: "0644"
        content: |
          Types: deb
          URIs: http://download.proxmox.com/debian/pve
          Suites: trixie
          Components: pve-no-subscription
          Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
      when: ansible_distribution_release == 'trixie'

    - name: Add no-subscription repo (PVE 8 / Debian bookworm)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/pve-no-subscription.list
        mode: "0644"
        content: "deb http://download.proxmox.com/debian/pve bookworm pve-no-subscription\n"
      when: ansible_distribution_release == 'bookworm'

    - name: Update package lists and install all upgrades
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist

    # ------------------------------------------------------------------
    # 2. Storage and host tuning
    # ------------------------------------------------------------------
    - name: Allow only iso/templates/backups/snippets on 'local' (no VM disks)
      ansible.builtin.command: pvesm set local --content iso,vztmpl,backup,snippets
      changed_when: false

    - name: Make the host use swap only as a last resort
      ansible.posix.sysctl:
        name: vm.swappiness
        value: "{{ host_swappiness }}"
        sysctl_file: /etc/sysctl.d/99-swappiness.conf
        reload: true

    # ------------------------------------------------------------------
    # 3. Cloud-init snippet + SSH key for the VMs
    # ------------------------------------------------------------------
    - name: Create snippets folder
      ansible.builtin.file:
        path: /var/lib/vz/snippets
        state: directory
        mode: "0755"

    - name: Upload cloud-init vendor snippet (installs qemu-guest-agent)
      ansible.builtin.copy:
        src: files/vendor.yaml
        dest: /var/lib/vz/snippets/vendor.yaml
        mode: "0644"

    - name: Copy the VM SSH public key to the host
      ansible.builtin.copy:
        content: "{{ lookup('file', vm_ssh_pubkey_file) }}\n"
        dest: /root/vm-ssh-key.pub
        mode: "0644"

    # ------------------------------------------------------------------
    # 4. Ubuntu cloud image + template VM 9000
    # ------------------------------------------------------------------
    - name: Check whether the template already exists
      ansible.builtin.stat:
        path: "/etc/pve/qemu-server/{{ template_id }}.conf"
      register: template_conf

    - name: Download Ubuntu 24.04 cloud image
      ansible.builtin.get_url:
        url: "{{ cloud_image_url }}"
        dest: "{{ cloud_image_path }}"
        mode: "0644"
      when: not template_conf.stat.exists

    - name: Build template VM {{ template_id }}
      ansible.builtin.shell: |
        set -e
        qm create {{ template_id }} --name {{ template_name }} --ostype l26 \
          --cpu host --cores 2 --memory 2048 \
          --net0 virtio,bridge={{ vm_bridge }} --scsihw virtio-scsi-single
        qm set {{ template_id }} --scsi0 {{ vm_storage }}:0,import-from={{ cloud_image_path }},discard=on,ssd=1,iothread=1
        qm set {{ template_id }} --ide2 {{ vm_storage }}:cloudinit --boot order=scsi0
        qm set {{ template_id }} --serial0 socket --vga serial0 --agent enabled=1
        qm set {{ template_id }} --ciuser ubuntu --sshkeys /root/vm-ssh-key.pub --ipconfig0 ip=dhcp
        qm set {{ template_id }} --cicustom "vendor=local:snippets/vendor.yaml"
        qm template {{ template_id }}
      args:
        executable: /bin/bash
      when: not template_conf.stat.exists

    - name: Delete the cloud image (template has its own copy)
      ansible.builtin.file:
        path: "{{ cloud_image_path }}"
        state: absent

    # ------------------------------------------------------------------
    # 5. API user + token for Terraform
    # ------------------------------------------------------------------
    - name: List Proxmox users
      ansible.builtin.command: pveum user list --output-format json
      register: pve_users
      changed_when: false

    - name: Create Terraform user
      ansible.builtin.command: pveum user add {{ terraform_user }} --comment "Terraform automation"
      when: terraform_user not in (pve_users.stdout | from_json | map(attribute='userid') | list)

    - name: Give the Terraform user admin rights (homelab-grade)
      ansible.builtin.command: pveum acl modify / --users {{ terraform_user }} --roles Administrator
      changed_when: false

    - name: List the Terraform user's tokens
      ansible.builtin.command: pveum user token list {{ terraform_user }} --output-format json
      register: pve_tokens
      changed_when: false

    - name: Create API token (secret is shown only once)
      ansible.builtin.command: >
        pveum user token add {{ terraform_user }} {{ terraform_token_name }}
        --privsep 0 --output-format json
      register: new_token
      when: terraform_token_name not in (pve_tokens.stdout | from_json | map(attribute='tokenid') | list)

    - name: Save token for Terraform on this machine
      ansible.builtin.copy:
        dest: "{{ terraform_token_file }}"
        mode: "0600"
        content: |
          # Generated by ansible/pve-host.yml. Do not commit.
          pve_api_token = "{{ (new_token.stdout | from_json)['full-tokenid'] }}={{ (new_token.stdout | from_json).value }}"
      delegate_to: localhost
      when: new_token is changed

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "Host ready. Template {{ template_id }} exists."
          - "{{ 'New API token saved to ' ~ terraform_token_file if new_token is changed else 'API token already existed (not re-created). If you lost it: pveum user token remove ' ~ terraform_user ~ ' ' ~ terraform_token_name ~ ' and re-run.' }}"
