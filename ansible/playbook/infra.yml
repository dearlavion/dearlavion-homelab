---
# infra.yml — Proxmox host, template, API token and VMs. Run from ansible/:
#
#   ansible-playbook playbook/infra.yml -e "target=infra"        # host + VMs   (default)
#   ansible-playbook playbook/infra.yml -e "target=infra-host"   # host + template + token
#   ansible-playbook playbook/infra.yml -e "target=infra-vms"    # VMs only (Terraform)
#
# Services:  playbook/services.yml   |   UIs:  playbook/frontend.yml

- name: Homelab infrastructure (Proxmox host + VMs)
  hosts: proxmox
  gather_facts: true

  vars:
    _target: "{{ target | default('infra') }}"
    run_infra_host: "{{ _target in ['all', 'infra', 'infra-host'] }}"
    run_infra_vms: "{{ _target in ['all', 'infra', 'infra-vms'] }}"

  tasks:
    - name: Check the target
      ansible.builtin.assert:
        that: _target in ['all', 'infra', 'infra-host', 'infra-vms']
        fail_msg: "Unknown target '{{ _target }}'. Use infra, infra-host or infra-vms."
        quiet: true

    - name: Infra (Proxmox host + VMs)
      ansible.builtin.include_role:
        name: infra
      vars:
        infra_run_host: "{{ run_infra_host }}"
        infra_run_vms: "{{ run_infra_vms }}"

- name: Wait for VMs to accept SSH
  hosts: vms
  gather_facts: false

  vars:
    _target: "{{ target | default('infra') }}"

  tasks:
    - name: Wait for SSH on each VM (first boot runs cloud-init)
      ansible.builtin.wait_for_connection:
        timeout: 300
      when: _target in ['all', 'infra', 'infra-vms']

    - name: Final sanity check
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} ({{ ansible_host }}) is reachable"
      when: _target in ['all', 'infra', 'infra-vms']
