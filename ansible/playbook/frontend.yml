---
# frontend.yml — UIs run as Docker containers (nginx serving the built SPA). Run from ansible/:
#
#   TF_VAR_net_prefix=192.168.8 ansible-playbook playbook/frontend.yml -e "app=security-ui"
#
# Same shape as services.yml: the VM is added by IP (net prefix + VM ID), so no Terraform run is
# needed. Secrets come from the environment, see roles/<app>/defaults/main.yml.
#
# Add an app: a role under roles/, its name in `_apps`, and a play below.

- name: Locate the VM for the app
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    _app: "{{ app | default('') }}"
    _apps: [security-ui]
    _net_prefix: "{{ lookup('env', 'TF_VAR_net_prefix') }}"

  tasks:
    - name: Check the app and network prefix
      ansible.builtin.assert:
        that:
          - _app in _apps
          - _net_prefix | length > 0
        fail_msg: >-
          Pass -e app=<one of {{ _apps }}> and set TF_VAR_net_prefix
          (e.g. 192.168.8). Got app='{{ _app }}', net prefix='{{ _net_prefix }}'.
        quiet: true

    - name: Add the security UI VM to the inventory (default k8s-w1, VM 101)
      ansible.builtin.add_host:
        name: security-ui-vm
        groups: security_ui_target
        ansible_host: "{{ _net_prefix }}.{{ security_ui_vm_id | default(101) }}"
        ansible_user: "{{ security_ui_vm_user | default('ubuntu') }}"
      when: _app == 'security-ui'

- name: Deploy the security UI
  hosts: security_ui_target
  gather_facts: false
  become: true

  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 60

    - name: Security UI role
      ansible.builtin.include_role:
        name: security_ui
