---
# ---- Template settings ----
template_id: 9000
template_name: ubuntu-2404-tmpl
vm_storage: local-lvm          # where VM disks live (thin pool)
vm_bridge: vmbr0

cloud_image_url: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
cloud_image_path: /var/lib/vz/template/iso/noble-server-cloudimg-amd64.img

# Public key that will be allowed to SSH into every VM.
# Default: the key of the machine you run Ansible from.
vm_ssh_pubkey_file: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519.pub"

# ---- Host tuning ----
host_swappiness: 10

# ---- Terraform API access ----
terraform_user: terraform@pve
terraform_token_name: tf
# Where to save the generated API token on YOUR machine (read by Terraform).
terraform_token_file: "{{ playbook_dir }}/../terraform/pve-token.auto.tfvars"
