---
# Role: security_ui
# Runs the Dear Lavion security UI (React SPA served by nginx, GHCR image) as a Docker container.
# Same-origin proxy: the browser only talks to this container; nginx forwards /api/v1/auth and
# /api/v1/superadmin to the auth service (needed for its SameSite=Strict refresh cookie).

# ---- Where (same VM as the auth service by default) ----
security_ui_vm_id: 101                         # k8s-w1
security_ui_vm_user: ubuntu

# ---- What ----
security_ui_image: ghcr.io/dearlavion/dearlavion-security-ui:homelab
security_ui_container_name: security-ui
# Earlier names of this container. They are removed first, because an old one still holds the port.
security_ui_old_container_names: [auth-ui]
security_ui_port: 8080                         # published on the VM; container listens on 80
security_ui_memory: 128m
security_ui_config_dir: /etc/security-ui           # rendered nginx.conf lives here, mounted read-only

# ---- Where the auth service is ----
# Default: the auth_service container published on this same VM. Point it elsewhere if it moves.
security_ui_auth_port: 9081
security_ui_auth_upstream: "http://{{ ansible_host }}:{{ security_ui_auth_port }}"
security_ui_auth_health_path: /actuator/health

# ---- GHCR login so the VM can pull the (private) image; read-only token ----
security_ui_registry: ghcr.io
security_ui_registry_user: "{{ lookup('env', 'GHCR_USER') }}"
security_ui_registry_token: "{{ lookup('env', 'GHCR_TOKEN') }}"

# ---- Check after deploy ----
security_ui_health_retries: 20
security_ui_health_delay: 3
