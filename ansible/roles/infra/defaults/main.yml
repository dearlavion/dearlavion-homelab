---
# Role: infra
# Proxmox host setup + Ubuntu template + Terraform API token + VMs (via Terraform).
# Override any of these with -e or in inventory/group_vars/proxmox.yml.

# ---- What to run (set by playbook/site.yml from `target`) ----
infra_run_host: true          # repos, upgrade, storage, sysctl, template, API token
infra_run_vms: true           # terraform plan/apply for VMs 100-103

# ---- Host ----
infra_full_upgrade: true      # apt full-upgrade (CI passes false unless asked)
infra_swappiness: 10
# Content types allowed on 'local'. Keep 'images': vm-runner (104) has its disk there.
infra_local_content: iso,vztmpl,backup,snippets,images,import

# ---- Template ----
infra_template_id: 9000
infra_template_name: ubuntu-2404-tmpl
infra_vm_storage: local-lvm   # thin pool for VM disks
infra_vm_bridge: vmbr0
infra_cloud_image_url: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
infra_cloud_image_path: /var/lib/vz/template/iso/noble-server-cloudimg-amd64.img
# Public key baked into the template (the machine running Ansible)
infra_vm_ssh_pubkey_file: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519.pub"

# ---- Terraform API access ----
infra_tf_user: terraform@pve
infra_tf_token_name: tf

# ---- Terraform (runs on the controller: your Mac or the CI container) ----
infra_terraform_dir: "{{ playbook_dir }}/../../terraform"
infra_tf_token_file: "{{ infra_terraform_dir }}/pve-token.auto.tfvars"
infra_tf_state_path: ""       # "" = terraform/terraform.tfstate; CI uses /state/terraform.tfstate
infra_allow_destroy: false    # allow plans that delete/replace VMs
infra_extra_ssh_key: ""       # extra public key for the VMs (e.g. your Mac)
infra_extra_ssh_keys: "{{ [infra_extra_ssh_key] if (infra_extra_ssh_key | length > 0) else [] }}"

# ---- Which VM(s) to deploy (infra-vms) ----
infra_vm: all                 # all | one name from infra_vm_all
infra_rebuild: false          # true = delete + recreate the selected VM(s)
# Keep in sync with locals.vms in terraform/main.tf
infra_vm_all: [k8s-cp, k8s-w1, k8s-w2, devops]
