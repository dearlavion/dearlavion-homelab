---
# ----------------------------
# Cloud-init snippet + SSH key
# ----------------------------
- name: Create snippets folder
  ansible.builtin.file:
    path: /var/lib/vz/snippets
    state: directory
    mode: "0755"

- name: Upload cloud-init vendor snippet (installs qemu-guest-agent)
  ansible.builtin.copy:
    src: vendor.yaml
    dest: /var/lib/vz/snippets/vendor.yaml
    mode: "0644"

- name: Copy the VM SSH public key to the host
  ansible.builtin.copy:
    content: "{{ lookup('file', infra_vm_ssh_pubkey_file) }}\n"
    dest: /root/vm-ssh-key.pub
    mode: "0644"

# ----------------------------
# Template VM
# ----------------------------
- name: Check whether the template already exists
  ansible.builtin.stat:
    path: "/etc/pve/qemu-server/{{ infra_template_id }}.conf"
  register: infra_template_conf

- name: Download Ubuntu 24.04 cloud image
  ansible.builtin.get_url:
    url: "{{ infra_cloud_image_url }}"
    dest: "{{ infra_cloud_image_path }}"
    mode: "0644"
  when: not infra_template_conf.stat.exists

- name: Build template VM {{ infra_template_id }}
  ansible.builtin.shell: |
    set -e
    qm create {{ infra_template_id }} --name {{ infra_template_name }} --ostype l26 \
      --cpu host --cores 2 --memory 2048 \
      --net0 virtio,bridge={{ infra_vm_bridge }} --scsihw virtio-scsi-single
    qm set {{ infra_template_id }} --scsi0 {{ infra_vm_storage }}:0,import-from={{ infra_cloud_image_path }},discard=on,ssd=1,iothread=1
    qm set {{ infra_template_id }} --ide2 {{ infra_vm_storage }}:cloudinit --boot order=scsi0
    qm set {{ infra_template_id }} --serial0 socket --vga serial0 --agent enabled=1
    qm set {{ infra_template_id }} --ciuser ubuntu --sshkeys /root/vm-ssh-key.pub --ipconfig0 ip=dhcp
    qm set {{ infra_template_id }} --cicustom "vendor=local:snippets/vendor.yaml"
    qm template {{ infra_template_id }}
  args:
    executable: /bin/bash
  when: not infra_template_conf.stat.exists

- name: Delete the cloud image (template has its own copy)
  ansible.builtin.file:
    path: "{{ infra_cloud_image_path }}"
    state: absent
