---
# Role: infra — entry point
- name: Proxmox host setup (repos, upgrade, storage, sysctl)
  ansible.builtin.include_tasks: host.yml
  when: infra_run_host | bool

- name: Ubuntu cloud-init template
  ansible.builtin.include_tasks: template.yml
  when: infra_run_host | bool

# Runs for host AND vms targets, so infra-vms works on its own.
# Idempotent: reuses the token if the saved file exists.
- name: Terraform API user + token
  ansible.builtin.include_tasks: api_token.yml
  when: infra_run_host | bool or infra_run_vms | bool

- name: VMs (Terraform)
  ansible.builtin.include_tasks: vms.yml
  when: infra_run_vms | bool
