---
# ----------------------------
# Proxmox API user + token for Terraform
# The secret is shown only once, so it is saved to infra_tf_token_file
# on the controller. If that file is lost, the token is re-created.
# ----------------------------
- name: List Proxmox users
  ansible.builtin.command: pveum user list --output-format json
  register: infra_pve_users
  changed_when: false

- name: Create Terraform user
  ansible.builtin.command: pveum user add {{ infra_tf_user }} --comment "Terraform automation"
  when: infra_tf_user not in (infra_pve_users.stdout | from_json | map(attribute='userid') | list)

- name: Give the Terraform user admin rights (homelab-grade)
  ansible.builtin.command: pveum acl modify / --users {{ infra_tf_user }} --roles Administrator
  changed_when: false

- name: Check for the saved token file on the controller
  ansible.builtin.stat:
    path: "{{ infra_tf_token_file }}"
  delegate_to: localhost
  become: false
  register: infra_token_file_stat

- name: List the Terraform user's tokens
  ansible.builtin.command: pveum user token list {{ infra_tf_user }} --output-format json
  register: infra_pve_tokens
  changed_when: false

- name: Note whether the token exists in Proxmox
  ansible.builtin.set_fact:
    infra_token_in_pve: "{{ infra_tf_token_name in (infra_pve_tokens.stdout | from_json | map(attribute='tokenid') | list) }}"

- name: Remove token whose secret was lost (no saved file)
  ansible.builtin.command: pveum user token remove {{ infra_tf_user }} {{ infra_tf_token_name }}
  when: infra_token_in_pve and not infra_token_file_stat.stat.exists

- name: Create API token
  ansible.builtin.command: >
    pveum user token add {{ infra_tf_user }} {{ infra_tf_token_name }}
    --privsep 0 --output-format json
  register: infra_new_token
  when: not (infra_token_in_pve and infra_token_file_stat.stat.exists)

- name: Save token for Terraform on the controller
  ansible.builtin.copy:
    dest: "{{ infra_tf_token_file }}"
    mode: "0600"
    content: |
      # Generated by the infra role. Do not commit.
      pve_api_token = "{{ (infra_new_token.stdout | from_json)['full-tokenid'] }}={{ (infra_new_token.stdout | from_json).value }}"
  delegate_to: localhost
  become: false
  when: infra_new_token is changed
