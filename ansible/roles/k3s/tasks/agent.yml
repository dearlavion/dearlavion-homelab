---
# Worker. Runs on each agent VM, as root. Needs k3s_join_token from the server play.
# Docker's firewall rules can break pod networking: don't join a VM that is running containers.
- name: Look for running Docker containers (only before the first install)
  ansible.builtin.shell: |
    if [ ! -e /etc/systemd/system/k3s-agent.service ] && command -v docker >/dev/null; then
      docker ps --format '{{ '{{' }}.Names{{ '}}' }}'
    fi
  register: k3s_agent_containers
  changed_when: false

- name: Stop if this VM is running Docker containers
  ansible.builtin.assert:
    that: k3s_agent_containers.stdout | length == 0
    fail_msg: >-
      {{ inventory_hostname }} is running Docker containers
      ({{ k3s_agent_containers.stdout_lines | join(', ') }}). Move them off this VM, then run
      install again (docs/kubernetes.md).
    quiet: true

- name: Download the k3s install script
  ansible.builtin.get_url:
    url: "{{ k3s_install_script_url }}"
    dest: "{{ k3s_install_script }}"
    mode: "0755"

- name: Install k3s (agent) and join the cluster
  ansible.builtin.command:
    cmd: "{{ k3s_install_script }} agent --node-ip {{ ansible_host }}"
    creates: /etc/systemd/system/k3s-agent.service
  environment:
    INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    K3S_URL: "https://{{ k3s_server_ip }}:{{ k3s_api_port }}"
    K3S_TOKEN: "{{ k3s_join_token }}"
  no_log: true

- name: k3s-agent service is enabled and running
  ansible.builtin.service:
    name: k3s-agent
    state: started
    enabled: true
