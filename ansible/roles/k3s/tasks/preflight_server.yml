---
# restart / redeploy: checks on the control plane, after the workers were checked.
- name: Work out which workers are included
  ansible.builtin.set_fact:
    k3s_included_workers: >-
      {{ groups['k3s_maint'] | default([]) | map('extract', hostvars)
         | selectattr('k3s_selected') | map(attribute='inventory_hostname') | list }}

- name: There must be something to do
  ansible.builtin.assert:
    that: k3s_include_server or (k3s_included_workers | length > 0)
    fail_msg: "ERROR: none of the targeted workers has k3s installed yet. Run action=install."
    quiet: true

- name: Expect these nodes at the end
  ansible.builtin.set_fact:
    k3s_expected_nodes: "{{ [k3s_controller_name] + k3s_included_workers }}"

- name: Is the k3s server installed here?
  ansible.builtin.stat:
    path: /etc/systemd/system/k3s.service
  register: k3s_server_unit

# Redeploying the control plane may also repair a missing one; everything else needs it.
- name: The control plane must be installed
  ansible.builtin.assert:
    that: k3s_server_unit.stat.exists or (operation == 'redeploy' and k3s_include_server)
    fail_msg: >-
      ERROR: k3s is not installed yet on control plane {{ k3s_controller_name }}. Run
      action=install first. Nothing was changed.
    quiet: true

# Acting on workers only needs a running control plane.
- name: The control plane must be running for a worker-only action
  ansible.builtin.include_tasks: check_service.yml
  vars:
    k3s_service: k3s
    k3s_role_label: control plane
    k3s_vm_name: "{{ k3s_controller_name }}"
  when: not k3s_include_server

- name: Check the install script can be downloaded
  ansible.builtin.get_url:
    url: "{{ k3s_install_script_url }}"
    dest: "{{ k3s_install_script }}"
    mode: "0755"
  when: operation == 'redeploy' and k3s_include_server

- name: Checks before redeploying workers only
  when: operation == 'redeploy' and not k3s_include_server
  block:
    - name: Read the control plane version
      ansible.builtin.command: k3s --version
      register: k3s_running_version
      changed_when: false

    # A worker must never be newer than the control plane.
    - name: The pinned version must match the control plane
      ansible.builtin.assert:
        that: k3s_version | length > 0 and (k3s_version ~ ' ') in k3s_running_version.stdout
        fail_msg: >-
          Control plane reports '{{ k3s_running_version.stdout_lines | first }}' but k3s_version is
          '{{ k3s_version }}'. Make them match before redeploying a worker. Nothing was removed.
        quiet: true

    - name: Read the join token
      ansible.builtin.include_tasks: token.yml
