# homelab-deploy-infra.yml
# Proxmox host setup + VMs (ansible/roles/infra + terraform/)
# Manual only: Actions -> homelab-deploy-infra -> Run workflow (pick target).
# Also owns the TOOLBOX image (Ansible + Terraform) used by every homelab-* workflow:
# it is built here, automatically, only when its tag is missing from GHCR (first run, or after
# toolbox/ changed). Target "toolbox" forces a rebuild and deploys nothing.
# Services live in homelab-services.yml, UIs in homelab-frontend.yml (later).
name: homelab-deploy-infra

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        required: true
        type: choice
        default: infra
        options:
          - toolbox             # (re)build the toolbox image only, deploys nothing
          - infra               # Proxmox host + all VMs
          - infra-host          # host setup, template 9000, API token
          - infra-vms           # all VMs (create missing, keep existing)
          - infra-vms:k8s-cp    # only this VM (create/update)
          - infra-vms:k8s-w1
          - infra-vms:k8s-w2
          - infra-vms:devops
          - rebuild:k8s-cp      # DELETE + recreate only this VM
          - rebuild:k8s-w1
          - rebuild:k8s-w2
          - rebuild:devops
          - rebuild:all         # DELETE + recreate ALL VMs
      allow_destroy:
        description: "Allow Terraform to delete/replace VMs | default(false)"
        required: false
        type: boolean
        default: false
      full_upgrade:
        description: "Run apt full-upgrade on the Proxmox host | default(false)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

# One homelab deploy at a time across ALL homelab-* workflows
# (shared Terraform state, and infra can rebuild a VM a service runs on).
concurrency:
  group: homelab-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dearlavion/dearlavion-homelab-toolbox

jobs:
  # ----------------------------
  # 1. Toolbox image (Ansible + Terraform), built on GitHub, pushed to GHCR.
  #    Skipped when an image for the current toolbox/ contents already exists.
  # ----------------------------
  build-toolbox:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Tag = hash of toolbox/
        id: tag
        run: echo "tag=$(find toolbox -type f | sort | xargs sha256sum | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Does this toolbox image already exist?
        id: exists
        run: |
          if docker buildx imagetools inspect "$IMAGE:${{ steps.tag.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Toolbox $IMAGE:${{ steps.tag.outputs.tag }} already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Toolbox $IMAGE:${{ steps.tag.outputs.tag }} not found, building it."
          fi

      - name: Build & Push Image
        if: steps.exists.outputs.exists != 'true' || inputs.target == 'toolbox'
        uses: docker/build-push-action@v6
        with:
          context: toolbox
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------
  # 2. Self-hosted runner on vm-runner (VM 104, inside your LAN):
  #    pull the toolbox and run Ansible + Terraform in it
  # ----------------------------
  deploy:
    needs: build-toolbox
    if: inputs.target != 'toolbox'
    runs-on: [self-hosted, proxmox-deploy]
    permissions:
      contents: read
      packages: read
    env:
      STATE_DIR: /var/lib/homelab-state
      TOOLBOX_TAG: ${{ needs.build-toolbox.outputs.tag }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Pull toolbox image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$IMAGE:$TOOLBOX_TAG"

      - name: Run playbook/infra.yml
        env:
          CHOICE: ${{ inputs.target }}
          ALLOW_DESTROY: ${{ inputs.allow_destroy == true }}
          PVE_FULL_UPGRADE: ${{ inputs.full_upgrade == true }}
        run: |
          # Split the dropdown choice: "rebuild:k8s-w1" -> infra-vms + k8s-w1 + rebuild
          case "$CHOICE" in
            rebuild:*)   TARGET=infra-vms; VM_NAME="${CHOICE#*:}"; VM_REBUILD=true ;;
            infra-vms:*) TARGET=infra-vms; VM_NAME="${CHOICE#*:}"; VM_REBUILD=false ;;
            *)           TARGET="$CHOICE"; VM_NAME=all; VM_REBUILD=false ;;
          esac
          echo "target=$TARGET vm=$VM_NAME rebuild=$VM_REBUILD"
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE":/work \
            -v "$STATE_DIR":/state \
            -v "$HOME/.ssh":/ssh-ro:ro \
            -e PLAYBOOK=infra \
            -e TARGET="$TARGET" \
            -e PVE_HOST='${{ vars.PVE_HOST }}' \
            -e TF_VAR_pve_endpoint='${{ vars.PVE_ENDPOINT }}' \
            -e TF_VAR_pve_node='${{ vars.PVE_NODE || 'pve' }}' \
            -e TF_VAR_net_prefix='${{ vars.NET_PREFIX }}' \
            -e TF_VAR_gateway='${{ vars.GATEWAY }}' \
            -e VM_EXTRA_SSH_KEY='${{ vars.VM_EXTRA_SSH_KEY }}' \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -e VM_NAME="$VM_NAME" -e VM_REBUILD="$VM_REBUILD" \
            -e ALLOW_DESTROY="$ALLOW_DESTROY" \
            -e PVE_FULL_UPGRADE="$PVE_FULL_UPGRADE" \
            "$IMAGE:$TOOLBOX_TAG" \
            bash /work/ci/run.sh

      - name: Clean up old toolbox images
        if: always()
        run: docker image prune -af --filter "until=72h" || true
