# build-toolbox.yml
# Reusable workflow, called by every homelab-* workflow (not run on its own).
# Toolbox image (Ansible + Terraform), built on GitHub, pushed to GHCR.
# Skipped when an image for the current toolbox/ contents already exists, unless force=true.
# Output "tag" = hash of toolbox/, which the caller's deploy job pulls.
name: build-toolbox

on:
  workflow_call:
    inputs:
      force:
        description: "Rebuild even if the image already exists"
        required: false
        type: boolean
        default: false
    outputs:
      tag:
        description: "Toolbox image tag"
        value: ${{ jobs.build.outputs.tag }}

# A caller's workflow-level env is not passed in. Keep IMAGE the same as in the callers.
env:
  IMAGE: ghcr.io/dearlavion/dearlavion-homelab-toolbox

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Tag = hash of toolbox/
        id: tag
        run: echo "tag=$(find toolbox -type f | sort | xargs sha256sum | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Does this toolbox image already exist?
        id: exists
        run: |
          if docker buildx imagetools inspect "$IMAGE:${{ steps.tag.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Toolbox $IMAGE:${{ steps.tag.outputs.tag }} already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Toolbox $IMAGE:${{ steps.tag.outputs.tag }} not found, building it."
          fi

      - name: Build & Push Image
        if: steps.exists.outputs.exists != 'true' || inputs.force
        uses: docker/build-push-action@v6
        with:
          context: toolbox
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
