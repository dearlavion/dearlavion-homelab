# homelab-cloudflare-tunnel.yml
# DNS + HTTPS for the UIs via a Cloudflare Tunnel (ansible/roles/cloudflared, playbook/tunnel.yml).
# Manual only: Actions -> homelab-cloudflare-tunnel -> Run workflow (pick an action). Setup: docs/tunnel.md.
# Uses the toolbox image (Ansible + Terraform). If that image does not exist yet, this workflow
# builds it first (build-toolbox.yml; tag = hash of toolbox/).
name: homelab-cloudflare-tunnel

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        required: true
        type: choice
        default: apply
        options:
          - apply     # create/update the tunnel, routes and DNS, run the connector, check the URLs
          - status    # look only: zone, tunnel health, public URLs

permissions:
  contents: read
  packages: write

# One homelab deploy at a time across ALL homelab-* workflows
concurrency:
  group: homelab-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dearlavion/dearlavion-homelab-toolbox

jobs:
  # ----------------------------
  # 1. Toolbox image: shared job in build-toolbox.yml (builds only if missing)
  # ----------------------------
  build-toolbox:
    uses: ./.github/workflows/build-toolbox.yml
    permissions:
      contents: read
      packages: write

  # ----------------------------
  # 2. vm-runner: pull the toolbox and deploy
  # ----------------------------
  deploy:
    needs: build-toolbox
    runs-on: [self-hosted, proxmox-deploy]
    permissions:
      contents: read
      packages: read
    env:
      TOOLBOX_TAG: ${{ needs.build-toolbox.outputs.tag }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Pull toolbox image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$IMAGE:$TOOLBOX_TAG"

      - name: Run playbook/tunnel.yml (${{ inputs.action }})
        env:
          STATE_DIR: /var/lib/homelab-state
          # Passed through by NAME below, never written into the script
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE":/work \
            -v "$STATE_DIR":/state \
            -v "$HOME/.ssh":/ssh-ro:ro \
            -e PLAYBOOK=tunnel \
            -e ACTION='${{ inputs.action }}' \
            -e TF_VAR_net_prefix='${{ vars.NET_PREFIX }}' \
            -e CLOUDFLARE_API_TOKEN \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            "$IMAGE:$TOOLBOX_TAG" \
            bash /work/ci/run.sh

      - name: Clean up old toolbox images
        if: always()
        run: docker image prune -af --filter "until=72h" || true
