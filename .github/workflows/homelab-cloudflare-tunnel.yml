# homelab-cloudflare-tunnel.yml
# DNS + HTTPS for the UIs via a Cloudflare Tunnel (ansible/roles/cloudflared, playbook/edge.yml).
# Manual only: Actions -> homelab-cloudflare-tunnel -> Run workflow (pick an action). Setup: docs/edge.md.
# Uses the toolbox image (Ansible + Terraform). If that image does not exist yet, this workflow
# builds it first (same rule as homelab-deploy-infra: tag = hash of toolbox/).
name: homelab-cloudflare-tunnel

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        required: true
        type: choice
        default: apply
        options:
          - apply     # create/update the tunnel, routes and DNS, run the connector, check the URLs
          - status    # look only: zone, tunnel health, public URLs

permissions:
  contents: read
  packages: write

# One homelab deploy at a time across ALL homelab-* workflows
concurrency:
  group: homelab-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dearlavion/dearlavion-homelab-toolbox

jobs:
  # ----------------------------
  # 1. Toolbox image: build + push ONLY if this toolbox/ version is not in GHCR yet
  # ----------------------------
  build-toolbox:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Tag = hash of toolbox/
        id: tag
        run: echo "tag=$(find toolbox -type f | sort | xargs sha256sum | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Does this toolbox image already exist?
        id: exists
        run: |
          if docker buildx imagetools inspect "$IMAGE:${{ steps.tag.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Toolbox $IMAGE:${{ steps.tag.outputs.tag }} already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Toolbox $IMAGE:${{ steps.tag.outputs.tag }} not found, building it."
          fi

      - name: Build & Push Image
        if: steps.exists.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: toolbox
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------
  # 2. vm-runner: pull the toolbox and deploy
  # ----------------------------
  deploy:
    needs: build-toolbox
    runs-on: [self-hosted, proxmox-deploy]
    permissions:
      contents: read
      packages: read
    env:
      TOOLBOX_TAG: ${{ needs.build-toolbox.outputs.tag }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Pull toolbox image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$IMAGE:$TOOLBOX_TAG"

      - name: Run playbook/edge.yml (${{ inputs.action }})
        env:
          STATE_DIR: /var/lib/homelab-state
          # Passed through by NAME below, never written into the script
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE":/work \
            -v "$STATE_DIR":/state \
            -v "$HOME/.ssh":/ssh-ro:ro \
            -e PLAYBOOK=edge \
            -e ACTION='${{ inputs.action }}' \
            -e TF_VAR_net_prefix='${{ vars.NET_PREFIX }}' \
            -e CLOUDFLARE_API_TOKEN \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            "$IMAGE:$TOOLBOX_TAG" \
            bash /work/ci/run.sh

      - name: Clean up old toolbox images
        if: always()
        run: docker image prune -af --filter "until=72h" || true
