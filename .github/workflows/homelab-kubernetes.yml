# homelab-kubernetes.yml
# k3s cluster on the VMs (ansible/roles/k3s, playbook/kubernetes.yml).
# Manual only: Actions -> homelab-kubernetes -> Run workflow (pick an action).
# Uses the toolbox image (Ansible + Terraform). If that image does not exist yet, this workflow
# builds it first (build-toolbox.yml; tag = hash of toolbox/).
name: homelab-kubernetes

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        required: true
        type: choice
        default: install
        options:
          - install    # install k3s: server on the controller, agents on the selected workers
          - status     # show nodes and system pods, change nothing
          - restart    # restart the k3s service on the target (not the VM)
          - redeploy   # uninstall + reinstall k3s on the target (DELETES its k3s data)
      controller:
        description: "Control plane VM"
        required: true
        type: choice
        default: k8s-cp
        options:
          - k8s-cp
      workers:
        description: "install/status: worker VM(s). Move Docker containers off k8s-w1 before choosing it or all"
        required: true
        type: choice
        default: k8s-w2
        options:
          - k8s-w2
          - k8s-w1
          - all
      target:
        description: "restart/redeploy only: what to act on (redeploy k8s-cp only via all)"
        required: true
        type: choice
        default: k8s-w2
        options:
          - k8s-w2
          - k8s-w1
          - all-workers
          - k8s-cp
          - all
      confirm:
        description: "restart/redeploy: type the action (restart or redeploy) to confirm"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

# One homelab deploy at a time across ALL homelab-* workflows
concurrency:
  group: homelab-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dearlavion/dearlavion-homelab-toolbox

jobs:
  # ----------------------------
  # 1. Toolbox image: shared job in build-toolbox.yml (builds only if missing)
  # ----------------------------
  build-toolbox:
    uses: ./.github/workflows/build-toolbox.yml
    permissions:
      contents: read
      packages: write

  # ----------------------------
  # 2. vm-runner: pull the toolbox and deploy
  # ----------------------------
  deploy:
    needs: build-toolbox
    runs-on: [self-hosted, proxmox-deploy]
    permissions:
      contents: read
      packages: read
    env:
      TOOLBOX_TAG: ${{ needs.build-toolbox.outputs.tag }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Pull toolbox image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$IMAGE:$TOOLBOX_TAG"

      - name: Run playbook/kubernetes.yml (${{ inputs.action }})
        env:
          STATE_DIR: /var/lib/homelab-state
          CONFIRM: ${{ inputs.confirm }}   # free text: passed as a variable, never pasted into the script
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE":/work \
            -v "$STATE_DIR":/state \
            -v "$HOME/.ssh":/ssh-ro:ro \
            -e PLAYBOOK=kubernetes \
            -e ACTION='${{ inputs.action }}' \
            -e CONTROLLER='${{ inputs.controller }}' \
            -e WORKERS='${{ inputs.workers }}' \
            -e K3S_TARGET='${{ inputs.target }}' \
            -e CONFIRM \
            -e TF_VAR_net_prefix='${{ vars.NET_PREFIX }}' \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            "$IMAGE:$TOOLBOX_TAG" \
            bash /work/ci/run.sh

      - name: Clean up old toolbox images
        if: always()
        run: docker image prune -af --filter "until=72h" || true
